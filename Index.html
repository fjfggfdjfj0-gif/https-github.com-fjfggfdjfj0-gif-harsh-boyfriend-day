<!DOCTYPE html>
<html>
<head>
  <title>For My Love ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      color: #fff;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
      max-width: 500px;
    }

    .heart {
      font-size: 70px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      50% { transform: scale(1.2); }
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #e75480;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="heart">❤️</div>

    <h1>For My Love</h1>

    <p>
      Mere bacha, meri jaan, my love ❤️
    </p>

    <p>
      Aapke saath har moment bahut achha lagta hai.
      Aap meri life ke un special people me se ho
      jinke saath time kab nikal jaata hai pata hi nahi chalta.
    </p>

    <p>
      Thank you for being there and making my moments special. ❤️
    </p>

    <button onclick="alert('I love you so much ❤️')">
      Click Me ❤️
    </button>
  </div>

</body>
</html>
